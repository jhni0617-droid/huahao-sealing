# hhseal.cn + xfastener.cn · Nginx 反向代理配置（2026-11-24 性能版）
#
# 新机器安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/sites.conf
#   sudo ln -sf /etc/nginx/sites-available/sites.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 上 SSL：
#   sudo certbot --nginx -d hhseal.cn -d www.hhseal.cn
#   certbot 跑完后，在 hhseal.cn 的 443 server 块里加一行 http2 on;
#   再跑一次 nginx -t && systemctl reload nginx
#
# ⚠️ 已装 SSL 的旧服务器不要整份覆盖本文件！按 deploy/README.md 的
#   「现有服务器性能修复」在 certbot 生成的配置里就地打补丁。

# HTML 页面缓存：站点是预渲染页，5 分钟足够；目录需预先建好（见 setup.sh）
proxy_cache_path /var/cache/nginx/hhseal_html levels=1:2 keys_zone=hhseal_html:20m
                 max_size=256m inactive=30m use_temp_path=off;

upstream hhseal_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream xfastener_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ── hhseal.cn ──
server {
    listen 80;
    listen [::]:80;
    server_name hhseal.cn www.hhseal.cn huahaoindustrial.com;

    # Next.js 的 Server Actions / 上传表单需要放宽一点
    client_max_body_size 20m;

    # 关键：带 hash 的构建产物由 Nginx 直接读盘，不经过 Node
    location /_next/static/ {
        alias /var/www/hhseal/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 关键：public/ 下 279 张图已全部预转 WebP，直接读盘，不经 /_next/image
    location /images/ {
        alias /var/www/hhseal/.next/standalone/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # 根路径是 307 语言跳转（带 Set-Cookie），绝不能缓存
    location = / {
        proxy_pass http://hhseal_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # 后台与接口是动态内容，绝不能缓存
    location ^~ /admin {
        proxy_pass http://hhseal_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location ^~ /api {
        proxy_pass http://hhseal_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        proxy_pass http://hhseal_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 必须透传真实 IP：/api/geo、/api/visit 依赖它做地域识别与统计
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;

        # 静态语言页缓存 5 分钟，与 ISR 周期一致；X-Page-Cache 可看命中情况
        proxy_cache hhseal_html;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_ignore_headers Set-Cookie;
        add_header X-Page-Cache $upstream_cache_status always;
    }
}

# ── xfastener.cn ──
# 如果不打算在同一台机器上跑紧固件站，整段删掉即可
server {
    listen 80;
    listen [::]:80;
    server_name xfastener.cn www.xfastener.cn;

    client_max_body_size 20m;

    location /_next/static/ {
        proxy_pass http://xfastener_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://xfastener_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

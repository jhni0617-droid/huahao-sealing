# hhseal.cn + xfastener.cn · Nginx 反向代理配置
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/sites.conf
#   sudo ln -sf /etc/nginx/sites-available/sites.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 上 SSL（certbot 会自动改写本文件，把 80 段换成 443 段并加跳转）：
#   sudo certbot --nginx -d hhseal.cn -d www.hhseal.cn -d xfastener.cn -d www.xfastener.cn

upstream hhseal_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream xfastener_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ── hhseal.cn ──
server {
    listen 80;
    listen [::]:80;
    server_name hhseal.cn www.hhseal.cn huahaoindustrial.com;

    # Next.js 的 Server Actions / 上传表单需要放宽一点
    client_max_body_size 20m;

    # 静态资源长缓存（文件名带 hash，不会失效）
    location /_next/static/ {
        proxy_pass http://hhseal_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://hhseal_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://hhseal_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 必须透传真实 IP：/api/geo、/api/visit 依赖它做地域识别与统计
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}

# ── xfastener.cn ──
# 如果不打算在同一台机器上跑紧固件站，整段删掉即可
server {
    listen 80;
    listen [::]:80;
    server_name xfastener.cn www.xfastener.cn;

    client_max_body_size 20m;

    location /_next/static/ {
        proxy_pass http://xfastener_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://xfastener_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" fill="#F8FAFC" rx="8"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="7.5" stroke="#E2E8F0"/>

  <!-- Seal ring cross-section graphic -->
  <g transform="translate(200, 130)">
    <!-- Outer ring -->
    <ellipse cx="0" cy="0" rx="100" ry="40" stroke="#2563EB" stroke-width="2.5" fill="none" opacity="0.3"/>
    <!-- Inner ring -->
    <ellipse cx="0" cy="0" rx="60" ry="24" stroke="#2563EB" stroke-width="2" fill="none" opacity="0.3"/>
    <!-- Connecting lines (cross-section look) -->
    <line x1="-100" y1="0" x2="-60" y2="0" stroke="#2563EB" stroke-width="2.5"/>
    <line x1="100" y1="0" x2="60" y2="0" stroke="#2563EB" stroke-width="2.5"/>

    <!-- Filled cross section (right half) -->
    <path d="M 100 0 A 100 40 0 0 1 100 0.1 L 60 0.06 A 60 24 0 0 0 60 0 Z" fill="#2563EB" opacity="0.15"/>

    <!-- Seal face highlight -->
    <rect x="-30" y="-12" width="60" height="24" rx="3" fill="#2563EB" opacity="0.08"/>
    <line x1="-25" y1="-8" x2="25" y2="-8" stroke="#2563EB" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#2563EB" stroke-width="1" opacity="0.5" stroke-dasharray="3,3"/>
    <line x1="-25" y1="8" x2="25" y2="8" stroke="#2563EB" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>

    <!-- Gradient shading left -->
    <defs>
      <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#2563EB" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#2563EB" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    <ellipse cx="0" cy="0" rx="80" ry="32" fill="url(#shade)"/>

    <!-- Spring wave indicator -->
    <path d="M -80 32 Q -70 38 -60 32 Q -50 26 -40 32 Q -30 38 -20 32 Q -10 26 0 32 Q 10 38 20 32 Q 30 26 40 32 Q 50 38 60 32 Q 70 26 80 32" stroke="#2563EB" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>

  <!-- Label -->
  <text x="200" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a202c">Carbon Graphite Seal Ring</text>
  <text x="200" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4a5568">Product Image Placeholder</text>
</svg>
